name: Validate renderer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python self_test.py
      - run: python render.py --output output/demo.pdf
      - run: python brochure.py build programmes/demo.json --output output/demo-brochure.pdf
      - run: python brochure.py intake programmes/_template.json || test $? -eq 3
      - run: python tools/package_skill.py
